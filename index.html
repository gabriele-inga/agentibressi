<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Test Agenti Vocali Retell</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f7f7f8;
    --card: #ffffff;
    --text: #1a1a1a;
    --muted: #666;
    --border: #e2e2e2;
    --accent: #2563eb;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111214;
      --card: #1b1c1f;
      --text: #f2f2f2;
      --muted: #a0a0a0;
      --border: #2c2d31;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 32px;
    width: 100%;
    max-width: 480px;
  }
  h1 {
    font-size: 1.3rem;
    margin: 0 0 8px;
  }
  p.sub {
    color: var(--muted);
    margin: 0 0 24px;
    font-size: 0.9rem;
    line-height: 1.4;
  }
  label {
    display: block;
    font-size: 0.85rem;
    font-weight: 600;
    margin-bottom: 6px;
  }
  select {
    width: 100%;
    padding: 10px 12px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
    font-size: 1rem;
  }
  .info {
    margin-top: 20px;
    padding: 14px 16px;
    border-radius: 10px;
    background: var(--bg);
    border: 1px solid var(--border);
    font-size: 0.85rem;
    color: var(--muted);
  }
  .info b { color: var(--text); }
  .hint {
    margin-top: 16px;
    font-size: 0.8rem;
    color: var(--muted);
  }
</style>
</head>
<body>
  <div class="card">
    <h1>Test Agenti Vocali</h1>
    <p class="sub">Seleziona un agente, poi usa il pulsante che compare in basso a destra per avviare la chiamata vocale con il widget Retell.</p>

    <label for="agent-select">Agente da testare</label>
    <select id="agent-select"></select>

    <div class="info" id="current-agent-info"></div>
    <p class="hint">Cambiando agente la pagina si ricarica per riavviare correttamente il widget.</p>
  </div>

<script>
  // Configurazione: chiave pubblica Retell (voice) e agenti disponibili
  var PUBLIC_KEY = "public_key_fccbf99d0940410a4303f";

  var AGENTS = {
    agenzia: {
      name: "Agenzia Immobiliare",
      agentId: "agent_34b5fa4b194a81e736377ab122",
      color: "#2563eb"
    },
    dentista: {
      name: "Studio Dentistico",
      agentId: "agent_cc49c5b933b11c01854eab083a",
      color: "#0d9488"
    }
  };

  var params = new URLSearchParams(location.search);
  var currentKey = params.get("agent");
  if (!AGENTS[currentKey]) currentKey = Object.keys(AGENTS)[0];
  var current = AGENTS[currentKey];

  // Popola la select
  var select = document.getElementById("agent-select");
  Object.keys(AGENTS).forEach(function (key) {
    var agent = AGENTS[key];
    var opt = document.createElement("option");
    opt.value = key;
    opt.textContent = agent.name;
    if (key === currentKey) opt.selected = true;
    select.appendChild(opt);
  });

  select.addEventListener("change", function () {
    var url = new URL(location.href);
    url.searchParams.set("agent", select.value);
    location.href = url.toString();
  });

  document.getElementById("current-agent-info").innerHTML =
    "Agente attivo: <b>" + current.name + "</b><br>ID: " + current.agentId;

  // Inietta il widget Retell per l'agente selezionato
  var script = document.createElement("script");
  script.id = "retell-widget";
  script.type = "module";
  script.src = "https://dashboard.retellai.com/retell-widget-v2.js";
  script.setAttribute("data-voice-public-key", PUBLIC_KEY);
  script.setAttribute("data-voice-agent-id", current.agentId);
  script.setAttribute("data-title", current.name);
  script.setAttribute("data-color", current.color);
  document.body.appendChild(script);
</script>
</body>
</html>
