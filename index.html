<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="color-scheme" content="light" />
<title>Assistenti Vocali</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root {
    color-scheme: light;
    --bg: #f2f4f7;
    --surface: #ffffff;
    --border: #dde1e7;
    --text: #171a1f;
    --muted: #5c626c;
    --focus: #171a1f;
  }
  * { box-sizing: border-box; }
  html, body { background: var(--bg); }
  body {
    margin: 0;
    font-size: 0.875rem;
    color: var(--text);
    font-family: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px 20px;
    -webkit-font-smoothing: antialiased;
  }
  ::selection { background: #171a1f; color: #f2f4f7; }

  .page {
    width: 100%;
    max-width: 560px;
  }

  header {
    text-align: center;
    margin-bottom: 32px;
  }
  h1 {
    font-size: clamp(1.85rem, 1.5rem + 1.6vw, 2.1rem);
    font-weight: 700;
    letter-spacing: -0.02em;
    margin: 0 0 12px;
  }
  header p {
    color: var(--muted);
    font-size: 0.875rem;
    line-height: 1.55;
    margin: 0 auto;
    max-width: 40ch;
  }

  fieldset {
    border: 0;
    margin: 0;
    padding: 0;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
  }
  @media (max-width: 480px) {
    fieldset { grid-template-columns: 1fr; }
  }
  legend {
    position: absolute;
    width: 1px; height: 1px;
    overflow: hidden;
    clip: rect(0 0 0 0);
    font-size: 0.875rem;
  }

  .option input {
    position: absolute;
    width: 1px; height: 1px;
    overflow: hidden;
    clip: rect(0 0 0 0);
  }
  .option label {
    display: flex;
    flex-direction: column;
    gap: 12px;
    height: 100%;
    padding: 22px 20px;
    background: var(--surface);
    border: 1.5px solid var(--border);
    border-radius: 16px;
    cursor: pointer;
    box-shadow: 0 1px 2px rgba(23, 26, 31, 0.05);
    transition: border-color 160ms ease, box-shadow 160ms ease, transform 160ms ease;
  }
  .option label:hover {
    border-color: var(--accent);
    transform: translateY(-1px);
  }
  .option input:focus-visible + label {
    outline: 2px solid var(--focus);
    outline-offset: 3px;
  }
  .option input:checked + label {
    border-color: var(--accent);
    box-shadow: 0 14px 28px -16px rgba(23, 26, 31, 0.35);
  }
  .option[data-agent="agenzia"] { --accent: #2f5fd6; --tint: #ebf0fc; }
  .option[data-agent="dentista"] { --accent: #0f8f74; --tint: #e8f6f2; }
  .option[data-agent="hotel"] { --accent: #7c4fd6; --tint: #f1ecfb; }
  .option[data-agent="pizzeria"] { --accent: #e2622a; --tint: #fdece3; }
  .option[data-agent="ristorante"] { --accent: #c23b3b; --tint: #fbeaea; }

  .icon-badge {
    width: 48px;
    height: 48px;
    border-radius: 12px;
    background: var(--tint);
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--accent);
  }
  .icon-badge svg { width: 26px; height: 26px; }

  .option .name {
    font-weight: 700;
    font-size: 1.25rem;
    letter-spacing: -0.01em;
  }
  .option .desc {
    color: var(--muted);
    font-size: 0.875rem;
    line-height: 1.45;
    margin: -6px 0 0;
  }

  .check {
    margin-left: auto;
    width: 20px;
    height: 20px;
    border-radius: 50%;
    border: 1.5px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .option input:checked + label .check {
    background: var(--accent);
    border-color: var(--accent);
  }
  .option .check svg {
    width: 12px;
    height: 12px;
    opacity: 0;
    transform: scale(0.6);
    transition: opacity 120ms ease, transform 120ms ease;
  }
  .option input:checked + label .check svg {
    opacity: 1;
    transform: scale(1);
  }
  .top-row {
    display: flex;
    align-items: flex-start;
    gap: 10px;
  }

  .status {
    margin-top: 22px;
    text-align: center;
    font-size: 0.875rem;
    color: var(--muted);
  }
  .status strong { color: var(--text); font-weight: 600; }
</style>
</head>
<body>
  <div class="page">
    <header>
      <h1>Prova i nostri assistenti vocali</h1>
      <p>Scegli con chi vuoi parlare, poi avvia la chiamata dal pulsante che comparirà in basso a destra.</p>
    </header>

    <form id="agent-form">
      <fieldset>
        <legend>Scegli un assistente</legend>

        <div class="option" data-agent="agenzia">
          <input type="radio" name="agent" id="agent-agenzia" value="agenzia" />
          <label for="agent-agenzia">
            <div class="top-row">
              <span class="icon-badge" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M3 11.5 12 4l9 7.5" />
                  <path d="M5.5 10v9a1 1 0 0 0 1 1H9a1 1 0 0 0 1-1v-4a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1v4a1 1 0 0 0 1 1h2.5a1 1 0 0 0 1-1v-9" />
                </svg>
              </span>
              <span class="check" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M4 12l6 6L20 6" />
                </svg>
              </span>
            </div>
            <span class="name">Agenzia Immobiliare</span>
            <p class="desc">Informazioni su immobili, visite e disponibilità.</p>
          </label>
        </div>

        <div class="option" data-agent="dentista">
          <input type="radio" name="agent" id="agent-dentista" value="dentista" />
          <label for="agent-dentista">
            <div class="top-row">
              <span class="icon-badge" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M12 4c-1.5 0-2.2 1-3.7 1-1.8 0-3.1 1.3-3 3.5.1 2.3.9 3.9 1.3 6.1.3 1.9.5 4.4 1.8 4.5 1.1.1 1.3-1.9 1.6-3.5.2-1.1.6-2.1 1.7-2.1h.5c1.1 0 1.5 1 1.7 2.1.3 1.6.5 3.6 1.6 3.5 1.3-.1 1.5-2.6 1.8-4.5.4-2.2 1.2-3.8 1.3-6.1.1-2.2-1.2-3.5-3-3.5-1.5 0-2.2-1-3.7-1z" />
                </svg>
              </span>
              <span class="check" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M4 12l6 6L20 6" />
                </svg>
              </span>
            </div>
            <span class="name">Studio Dentistico</span>
            <p class="desc">Prenotazioni, orari e domande frequenti dello studio.</p>
          </label>
        </div>

        <div class="option" data-agent="hotel">
          <input type="radio" name="agent" id="agent-hotel" value="hotel" />
          <label for="agent-hotel">
            <div class="top-row">
              <span class="icon-badge" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
                  <rect x="4" y="4" width="16" height="16" rx="1.5" />
                  <path d="M4 12h16" />
                  <path d="M8 4v8M16 4v8" />
                  <path d="M9 20v-2a3 3 0 0 1 6 0v2" />
                </svg>
              </span>
              <span class="check" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M4 12l6 6L20 6" />
                </svg>
              </span>
            </div>
            <span class="name">Hotel</span>
            <p class="desc">Disponibilità camere, prenotazioni e informazioni.</p>
          </label>
        </div>

        <div class="option" data-agent="pizzeria">
          <input type="radio" name="agent" id="agent-pizzeria" value="pizzeria" />
          <label for="agent-pizzeria">
            <div class="top-row">
              <span class="icon-badge" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
                  <path d="m2 16 20 6-6-20A20 20 0 0 0 2 16" />
                  <path d="M5.71 17.11a17.04 17.04 0 0 1 11.4-11.4" />
                  <path d="M15 11h.01" />
                  <path d="M11 15h.01" />
                  <path d="M16 16h.01" />
                </svg>
              </span>
              <span class="check" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M4 12l6 6L20 6" />
                </svg>
              </span>
            </div>
            <span class="name">Pizzeria</span>
            <p class="desc">Ordini, menu e prenotazioni del tavolo.</p>
          </label>
        </div>

        <div class="option" data-agent="ristorante">
          <input type="radio" name="agent" id="agent-ristorante" value="ristorante" />
          <label for="agent-ristorante">
            <div class="top-row">
              <span class="icon-badge" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M3 2v7c0 1.1.9 2 2 2h4a2 2 0 0 0 2-2V2" />
                  <path d="M7 2v20" />
                  <path d="M21 15V2a5 5 0 0 0-5 5v6c0 1.1.9 2 2 2h3Zm0 0v7" />
                </svg>
              </span>
              <span class="check" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M4 12l6 6L20 6" />
                </svg>
              </span>
            </div>
            <span class="name">Ristorante</span>
            <p class="desc">Prenotazioni, menu e informazioni sul locale.</p>
          </label>
        </div>
      </fieldset>
    </form>

    <p class="status" id="status"></p>
  </div>

<script>
  // Configurazione: chiave pubblica Retell (voice) e agenti disponibili.
  // Gli ID tecnici non vengono mai mostrati in interfaccia.
  var PUBLIC_KEY = "public_key_fccbf99d0940410a4303f";

  var AGENTS = {
    agenzia: {
      name: "Agenzia Immobiliare",
      agentId: "agent_34b5fa4b194a81e736377ab122",
      color: "#2f5fd6"
    },
    dentista: {
      name: "Studio Dentistico",
      agentId: "agent_cc49c5b933b11c01854eab083a",
      color: "#0f8f74"
    },
    hotel: {
      name: "Hotel",
      agentId: "agent_141e00cbc15b6885f713ed1ed2",
      color: "#7c4fd6"
    },
    pizzeria: {
      name: "Pizzeria",
      agentId: "agent_1017a45b7067857597ef47a1b5",
      color: "#e2622a"
    },
    ristorante: {
      name: "Ristorante",
      agentId: "agent_2e78ee9b138c6f23d05d61bc70",
      color: "#c23b3b"
    }
  };

  var params = new URLSearchParams(location.search);
  var currentKey = params.get("agent");
  if (!AGENTS[currentKey]) currentKey = Object.keys(AGENTS)[0];
  var current = AGENTS[currentKey];

  // Segna l'opzione corrente come selezionata
  document.getElementById("agent-" + currentKey).checked = true;

  // Cambiare agente ricarica la pagina per riavviare correttamente il widget
  document.querySelectorAll('input[name="agent"]').forEach(function (input) {
    input.addEventListener("change", function () {
      var url = new URL(location.href);
      url.searchParams.set("agent", input.value);
      location.href = url.toString();
    });
  });

  document.getElementById("status").innerHTML =
    "Premi il pulsante in basso a destra per parlare con <strong>" + current.name + "</strong>.";

  // Inietta il widget Retell per l'agente selezionato
  var script = document.createElement("script");
  script.id = "retell-widget";
  script.type = "module";
  script.src = "https://dashboard.retellai.com/retell-widget-v2.js";
  script.setAttribute("data-voice-public-key", PUBLIC_KEY);
  script.setAttribute("data-voice-agent-id", current.agentId);
  script.setAttribute("data-title", current.name);
  script.setAttribute("data-color", current.color);
  document.body.appendChild(script);
</script>
</body>
</html>
